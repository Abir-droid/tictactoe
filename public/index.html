<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cyberpunk Tic Tac Toe</title>
  <style>
    /* Dark Theme Palette (Default) */
    [data-theme="dark"] {
      --bg-color: #090d16;
      --bg-gradient: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #090d16 80%);
      --card-bg: rgba(22, 31, 49, 0.85);
      --card-border: rgba(255, 255, 255, 0.1);
      --input-bg: rgba(15, 23, 42, 0.6);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --heading-gradient: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
      --btn-sec-bg: rgba(255, 255, 255, 0.08);
      --btn-sec-hover: rgba(255, 255, 255, 0.15);
      --cell-bg: rgba(30, 41, 59, 0.7);
      --cell-hover: rgba(51, 65, 85, 0.8);
      --table-header: rgba(15, 23, 42, 0.8);
      --accent-blue: #38bdf8;
      --accent-cyan: #06b6d4;
      --accent-pink: #ec4899;
      --accent-green: #10b981;
      --accent-amber: #f59e0b;
      --shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
      --sun-color: #f59e0b;
      --chat-my-msg: #0284c7;
      --chat-opp-msg: #334155;
    }

    /* Light Theme Palette */
    [data-theme="light"] {
      --bg-color: #f1f5f9;
      --bg-gradient: radial-gradient(circle at 50% 20%, #e2e8f0 0%, #cbd5e1 80%);
      --card-bg: rgba(255, 255, 255, 0.9);
      --card-border: rgba(0, 0, 0, 0.08);
      --input-bg: rgba(241, 245, 249, 0.9);
      --text-main: #0f172a;
      --text-muted: #475569;
      --heading-gradient: linear-gradient(135deg, #0284c7 0%, #4f46e5 100%);
      --btn-sec-bg: rgba(0, 0, 0, 0.06);
      --btn-sec-hover: rgba(0, 0, 0, 0.12);
      --cell-bg: rgba(226, 232, 240, 0.8);
      --cell-hover: rgba(203, 213, 225, 1);
      --table-header: rgba(226, 232, 240, 0.9);
      --accent-blue: #0284c7;
      --accent-cyan: #0891b2;
      --accent-pink: #db2777;
      --accent-green: #059669;
      --accent-amber: #d97706;
      --shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
      --moon-color: #ffffff;
      --chat-my-msg: #0284c7;
      --chat-opp-msg: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      transition: background 0.25s ease, border-color 0.25s ease, color 0.25s ease, transform 0.2s ease;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      background: var(--bg-gradient);
      color: var(--text-main);
      margin: 0;
      padding: 1.5rem 1rem 3rem 1rem;
      overflow-x: hidden;
      position: relative;
    }

    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }

    /* Fixed App Header Layout */
    .app-header {
      width: 100%;
      max-width: 420px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 1vh;
      margin-bottom: 1.25rem;
      position: relative;
      min-height: 48px;
    }

    .app-title {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: var(--heading-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
      text-align: center;
      flex-grow: 1;
    }

    .nav-btn-wrapper {
      min-width: 44px;
      display: flex;
      align-items: center;
    }

    .theme-toggle-btn {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 0;
      flex-shrink: 0;
    }

    .theme-toggle-btn:hover {
      transform: scale(1.08);
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      padding: 1.5rem;
      border-radius: 20px;
      box-shadow: var(--shadow);
      text-align: center;
      width: 100%;
      max-width: 420px;
      animation: fadeInSlide 0.35s ease-out forwards;
      margin-bottom: 1rem;
    }

    @keyframes fadeInSlide {
      from { opacity: 0; transform: translateY(10px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    h2 {
      margin-top: 0;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: var(--heading-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      margin-top: 10px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: var(--input-bg);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
    }

    input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border-radius: 10px;
      border: none;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button.btn-sec {
      background: var(--btn-sec-bg);
      color: var(--text-main);
      box-shadow: none;
      border: 1px solid var(--card-border);
      width: auto;
      padding: 8px 14px;
      font-size: 0.85rem;
    }

    button.btn-sec:hover:not(:disabled) {
      background: var(--btn-sec-hover);
    }

    button:disabled {
      background: #94a3b8;
      color: #cbd5e1;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-retry { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
    .btn-new { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }

    .link-btn {
      display: inline-block;
      margin-top: 12px;
      color: var(--accent-blue);
      text-decoration: none;
      font-size: 0.88rem;
      cursor: pointer;
      font-weight: 500;
    }

    .link-btn:hover {
      text-decoration: underline;
    }

    .scoreboard-card {
      padding: 1rem;
    }

    .scoreboard {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .player-card {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .player-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--btn-sec-bg);
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .player-details {
      display: flex;
      flex-direction: column;
      text-align: left;
    }

    .player-details.right {
      text-align: right;
    }

    .player-name {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-main);
      max-width: 90px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .player-tag {
      font-size: 0.75rem;
      font-weight: 600;
    }

    .tag-x { color: var(--accent-cyan); }
    .tag-o { color: var(--accent-pink); }

    .score-badge {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-main);
      padding: 0 4px;
    }

    .vs-divider {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--text-muted);
      opacity: 0.6;
    }

    .chat-card {
      padding: 1rem;
      text-align: left;
    }

    .chat-header {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-blue);
      margin-bottom: 8px;
    }

    .chat-messages {
      height: 110px;
      overflow-y: auto;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 8px;
      background: var(--input-bg);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .chat-msg {
      max-width: 85%;
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 0.82rem;
      word-break: break-word;
    }

    .chat-msg.me {
      align-self: flex-end;
      background: var(--chat-my-msg);
      color: #fff;
      border-bottom-right-radius: 2px;
    }

    .chat-msg.them {
      align-self: flex-start;
      background: var(--chat-opp-msg);
      color: var(--text-main);
      border-bottom-left-radius: 2px;
    }

    .chat-input-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .chat-input-row input {
      margin-top: 0;
      padding: 8px 12px;
      font-size: 0.85rem;
    }

    .chat-input-row button {
      margin-top: 0;
      width: 70px;
      padding: 8px;
      font-size: 0.85rem;
    }

    .search-loader {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-radius: 50%;
      border-top-color: var(--accent-blue);
      animation: spin 1s infinite linear;
      margin: 12px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Board Responsive Grid */
    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 15px auto 0 auto;
      justify-content: center;
      width: max-content;
    }

    .cell {
      width: clamp(75px, 22vw, 95px);
      height: clamp(75px, 22vw, 95px);
      background: var(--cell-bg);
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 14px;
      user-select: none;
    }

    .cell:hover {
      background: var(--cell-hover);
      transform: scale(1.02);
    }

    .cell svg {
      width: clamp(34px, 10vw, 44px);
      height: clamp(34px, 10vw, 44px);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .cell.pop-x svg {
      stroke: var(--accent-cyan);
      filter: drop-shadow(0 0 6px rgba(6, 182, 212, 0.6));
      animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .cell.pop-o svg {
      stroke: var(--accent-pink);
      filter: drop-shadow(0 0 6px rgba(236, 72, 153, 0.6));
      animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0.4); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .leaderboard-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 0.85rem;
      border-radius: 10px;
      overflow: hidden;
    }

    .leaderboard-table th, .leaderboard-table td {
      padding: 8px 6px;
      border-bottom: 1px solid var(--card-border);
      text-align: center;
    }

    .leaderboard-table th {
      background: var(--table-header);
      color: var(--accent-blue);
      font-weight: 600;
    }

    .hidden { display: none !important; }
    #status { margin-top: 8px; font-weight: 600; font-size: 0.95rem; color: var(--accent-blue); }
    #retry-msg { margin-top: 6px; font-size: 0.85rem; color: var(--accent-amber); }

    /* Extra Mobile Tweaks */
    @media (max-width: 480px) {
      body {
        padding: 0.75rem 0.75rem 2rem 0.75rem;
      }
      .app-title {
        font-size: 1.35rem;
      }
      .card {
        padding: 1.25rem 1rem;
        border-radius: 16px;
      }
      button {
        padding: 11px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

  <canvas id="confetti-canvas"></canvas>

  <!-- App Header bar -->
  <div class="app-header">
    <div class="nav-btn-wrapper">
      <div id="top-left-nav" class="hidden">
        <button class="btn-sec" onclick="returnToDashboard()">← Back</button>
      </div>
    </div>
    <h1 class="app-title">Cyber Tac Toe</h1>
    <div class="nav-btn-wrapper" style="justify-content: flex-end;">
      <button class="theme-toggle-btn" onclick="toggleTheme()" id="theme-btn" aria-label="Toggle Theme">
        <svg id="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--sun-color)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        <svg id="icon-moon" class="hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--moon-color)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      </button>
    </div>
  </div>

  <!-- LOGIN -->
  <div class="card" id="login-view">
    <h2>Login</h2>
    <input type="text" id="login-username" placeholder="Username" />
    <input type="password" id="login-password" placeholder="Password" />
    <button onclick="login()">Login</button>
    <div>
      <a class="link-btn" onclick="showView('register-view')">Create new account</a>
    </div>
  </div>

  <!-- REGISTER -->
  <div class="card hidden" id="register-view">
    <h2>Create Account</h2>
    <input type="text" id="reg-username" placeholder="Username" />
    <input type="password" id="reg-password" placeholder="Password" />
    <button onclick="register()">Register / Create Account</button>
    <div>
      <a class="link-btn" onclick="showView('login-view')">Already have an account? Login</a>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div class="card hidden" id="dashboard-view">
    <h2 style="margin-bottom: 2px;">Welcome</h2>
    <div id="user-display" style="color: var(--accent-cyan); font-weight: 700; font-size: 1.15rem; margin-bottom: 12px;"></div>

    <button onclick="startNewGame()">New Game 🎮</button>
    <button class="btn-sec" style="width: 100%; margin-top: 8px;" onclick="logout()">Logout 🚪</button>

    <h3 style="margin-top: 20px; margin-bottom: 8px; font-size: 0.95rem; color: var(--text-muted);">🏆 Global Leaderboard</h3>
    <table class="leaderboard-table">
      <thead>
        <tr>
          <th>Player</th>
          <th>W</th>
          <th>L</th>
          <th>D</th>
        </tr>
      </thead>
      <tbody id="leaderboard-body">
        <tr><td colspan="4">Loading...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- SCOREBOARD CARD -->
  <div id="scoreboard-card" class="card scoreboard-card hidden">
    <div class="scoreboard">
      <div class="player-card">
        <div class="player-avatar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </div>
        <div class="player-details">
          <span id="sb-p1-name" class="player-name">You</span>
          <span id="sb-p1-sym" class="player-tag tag-x">Symbol X</span>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 4px;">
        <span id="sb-p1-score" class="score-badge">0</span>
        <span class="vs-divider">:</span>
        <span id="sb-p2-score" class="score-badge">0</span>
      </div>

      <div class="player-card">
        <div class="player-details right">
          <span id="sb-p2-name" class="player-name">Opponent</span>
          <span id="sb-p2-sym" class="player-tag tag-o">Symbol O</span>
        </div>
        <div class="player-avatar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 1-3-3.87"></path><path d="M4 21v-2a4 4 0 0 1 3-3.87"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </div>
      </div>
    </div>
  </div>

  <!-- MAIN GAME CARD -->
  <div class="card hidden" id="game-view">
    <div id="search-spinner" class="search-loader hidden"></div>
    <div id="status">Click to Search Player</div>
    <div id="retry-msg"></div>
    
    <button id="find-btn" onclick="findMatch()">Find Opponent</button>
    <button id="retry-btn" class="btn-retry hidden" onclick="requestRetry()">Play Again 🔄</button>
    <button id="new-opp-btn" class="btn-new hidden" onclick="findMatch()">Find New Opponent 🔍</button>

    <div class="board hidden" id="board">
      <div class="cell" onclick="makeMove(0)"></div>
      <div class="cell" onclick="makeMove(1)"></div>
      <div class="cell" onclick="makeMove(2)"></div>
      <div class="cell" onclick="makeMove(3)"></div>
      <div class="cell" onclick="makeMove(4)"></div>
      <div class="cell" onclick="makeMove(5)"></div>
      <div class="cell" onclick="makeMove(6)"></div>
      <div class="cell" onclick="makeMove(7)"></div>
      <div class="cell" onclick="makeMove(8)"></div>
    </div>
  </div>

  <!-- LIVE CHATBOX CARD -->
  <div id="chat-card" class="card chat-card hidden">
    <div class="chat-header">💬 Live Match Chat</div>
    <div id="chat-messages" class="chat-messages"></div>
    <div class="chat-input-row">
      <input type="text" id="chat-input" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendChat()" />
      <button onclick="sendChat()">Send</button>
    </div>
  </div>

  <script>
    let ws;
    let myUsername = "";
    let mySymbol = "";
    let currentTurn = "";
    let opponentUsername = "";
    let p1SessionScore = 0;
    let p2SessionScore = 0;

    const svgIconX = `<svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>`;
    const svgIconO = `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"></circle></svg>`;

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute("data-theme");
      const next = current === "dark" ? "light" : "dark";
      
      html.setAttribute("data-theme", next);
      if (next === "light") {
        document.getElementById("icon-sun").classList.add("hidden");
        document.getElementById("icon-moon").classList.remove("hidden");
      } else {
        document.getElementById("icon-moon").classList.add("hidden");
        document.getElementById("icon-sun").classList.remove("hidden");
      }
    }

    function showView(viewId) {
      document.getElementById("login-view").classList.add("hidden");
      document.getElementById("register-view").classList.add("hidden");
      document.getElementById("dashboard-view").classList.add("hidden");
      document.getElementById("game-view").classList.add("hidden");
      document.getElementById("scoreboard-card").classList.add("hidden");
      document.getElementById("chat-card").classList.add("hidden");
      document.getElementById("top-left-nav").classList.add("hidden");

      if (viewId === "game-view") {
        document.getElementById("game-view").classList.remove("hidden");
        document.getElementById("top-left-nav").classList.remove("hidden");
      } else {
        document.getElementById(viewId).classList.remove("hidden");
      }
    }

    async function login() {
      const user = document.getElementById("login-username").value.trim();
      const pass = document.getElementById("login-password").value.trim();
      if (!user || !pass) return alert("Enter both username and password");

      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: user, password: pass })
      });

      if (res.ok) {
        myUsername = user;
        openDashboard();
      } else {
        const err = await res.text();
        alert(err);
      }
    }

    async function register() {
      const user = document.getElementById("reg-username").value.trim();
      const pass = document.getElementById("reg-password").value.trim();
      if (!user || !pass) return alert("Enter both username and password");

      const res = await fetch("/api/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: user, password: pass })
      });

      if (res.ok) {
        myUsername = user;
        openDashboard();
      } else {
        const err = await res.text();
        alert(err);
      }
    }

    function openDashboard() {
      document.getElementById("user-display").innerText = myUsername;
      showView("dashboard-view");
      loadLeaderboard();
      connectWebSocket();
    }

    async function loadLeaderboard() {
      const tbody = document.getElementById("leaderboard-body");
      tbody.innerHTML = '<tr><td colspan="4">Loading...</td></tr>';

      try {
        const res = await fetch("/api/leaderboard");
        const data = await res.json();

        if (data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4">No games played yet</td></tr>';
          return;
        }

        tbody.innerHTML = data.map(player => `
          <tr>
            <td><strong>${player.username}</strong></td>
            <td style="color: var(--accent-green);">${player.wins}</td>
            <td style="color: #ef4444;">${player.losses}</td>
            <td style="color: var(--accent-amber);">${player.draws}</td>
          </tr>
        `).join('');
      } catch (e) {
        tbody.innerHTML = '<tr><td colspan="4">Failed to load</td></tr>';
      }
    }

    function connectWebSocket() {
      if (ws && ws.readyState === WebSocket.OPEN) return;

      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${location.host}/ws?username=${myUsername}`);

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);

        switch (msg.type) {
          case "MATCH_FOUND":
            p1SessionScore = 0;
            p2SessionScore = 0;
            setupMatch(msg);
            break;

          case "GAME_STATE":
            currentTurn = msg.turn;
            renderBoard(msg.board);
            updateStatus(`Turn: Player [${currentTurn}]`);
            break;

          case "GAME_OVER":
            renderBoard(msg.board);
            if (msg.winner === "DRAW") {
              updateStatus("Game Over: It's a Draw!");
            } else if (msg.winner === mySymbol) {
              p1SessionScore++;
              updateStatus("🎉 Victory!");
              triggerFireworks();
            } else {
              p2SessionScore++;
              updateStatus("❌ Defeat!");
            }
            updateScoreboard();
            document.getElementById("retry-btn").classList.remove("hidden");
            document.getElementById("retry-btn").disabled = false;
            document.getElementById("new-opp-btn").classList.remove("hidden");
            break;

          case "RETRY_REQUESTED":
            document.getElementById("retry-msg").innerText = msg.message;
            break;

          case "RESTART_GAME":
            document.getElementById("retry-btn").classList.add("hidden");
            document.getElementById("new-opp-btn").classList.add("hidden");
            document.getElementById("retry-msg").innerText = "";
            mySymbol = msg.symbol;
            currentTurn = msg.turn;
            updateScoreboard();
            renderBoard(msg.board);
            updateStatus(`Rematch Started! Turn: Player [${currentTurn}]`);
            break;

          case "CHAT":
            appendChatMessage(msg.sender, msg.message);
            break;

          case "OPPONENT_LEFT":
            updateStatus(msg.message);
            document.getElementById("board").classList.add("hidden");
            document.getElementById("scoreboard-card").classList.add("hidden");
            document.getElementById("chat-card").classList.add("hidden");
            document.getElementById("retry-btn").classList.add("hidden");
            document.getElementById("new-opp-btn").classList.add("hidden");
            document.getElementById("find-btn").classList.remove("hidden");
            document.getElementById("find-btn").disabled = false;
            document.getElementById("search-spinner").classList.add("hidden");
            document.getElementById("retry-msg").innerText = "";
            break;

          case "ERROR":
            alert(msg.error);
            break;
        }
      };

      ws.onclose = () => {
        setTimeout(() => {
          if (myUsername) connectWebSocket();
        }, 3000);
      };
    }

    function startNewGame() {
      showView("game-view");
      resetGameUI();
    }

    function returnToDashboard() {
      showView("dashboard-view");
      loadLeaderboard();
      resetGameUI();
    }

    function logout() {
      if (ws) {
        ws.onclose = null;
        ws.close();
      }
      myUsername = "";
      document.getElementById("login-username").value = "";
      document.getElementById("login-password").value = "";
      document.getElementById("reg-username").value = "";
      document.getElementById("reg-password").value = "";
      showView("login-view");
    }

    function resetGameUI() {
      document.getElementById("board").classList.add("hidden");
      document.getElementById("scoreboard-card").classList.add("hidden");
      document.getElementById("chat-card").classList.add("hidden");
      document.getElementById("retry-btn").classList.add("hidden");
      document.getElementById("new-opp-btn").classList.add("hidden");
      document.getElementById("search-spinner").classList.add("hidden");
      document.getElementById("find-btn").classList.remove("hidden");
      document.getElementById("find-btn").disabled = false;
      document.getElementById("retry-msg").innerText = "";
      document.getElementById("chat-messages").innerHTML = "";
      updateStatus("Click to Search Player");
    }

    function setupMatch(msg) {
      mySymbol = msg.symbol;
      currentTurn = msg.turn;
      opponentUsername = msg.opponent;

      document.getElementById("search-spinner").classList.add("hidden");
      document.getElementById("find-btn").classList.add("hidden");
      document.getElementById("retry-btn").classList.add("hidden");
      document.getElementById("new-opp-btn").classList.add("hidden");
      document.getElementById("board").classList.remove("hidden");
      document.getElementById("scoreboard-card").classList.remove("hidden");
      document.getElementById("chat-card").classList.remove("hidden");
      document.getElementById("retry-msg").innerText = "";
      document.getElementById("chat-messages").innerHTML = "";

      updateScoreboard();
      renderBoard(["", "", "", "", "", "", "", "", ""]);
      updateStatus(`Matched vs ${msg.opponent}! Turn: Player [${currentTurn}]`);
    }

    function updateScoreboard() {
      document.getElementById("sb-p1-name").innerText = myUsername;
      document.getElementById("sb-p1-sym").innerText = `[${mySymbol}]`;
      document.getElementById("sb-p1-sym").className = `player-tag ${mySymbol === 'X' ? 'tag-x' : 'tag-o'}`;
      document.getElementById("sb-p1-score").innerText = p1SessionScore;

      const oppSymbol = mySymbol === 'X' ? 'O' : 'X';
      document.getElementById("sb-p2-name").innerText = opponentUsername;
      document.getElementById("sb-p2-sym").innerText = `[${oppSymbol}]`;
      document.getElementById("sb-p2-sym").className = `player-tag ${oppSymbol === 'X' ? 'tag-x' : 'tag-o'}`;
      document.getElementById("sb-p2-score").innerText = p2SessionScore;
    }

    function sendChat() {
      const input = document.getElementById("chat-input");
      const text = input.value.trim();
      if (!text || !ws) return;

      ws.send(JSON.stringify({ type: "CHAT", message: text }));
      input.value = "";
    }

    function appendChatMessage(sender, text) {
      const container = document.getElementById("chat-messages");
      const isMe = sender === myUsername;

      const msgDiv = document.createElement("div");
      msgDiv.className = `chat-msg ${isMe ? "me" : "them"}`;
      msgDiv.innerText = isMe ? text : `${sender}: ${text}`;

      container.appendChild(msgDiv);
      container.scrollTop = container.scrollHeight;
    }

    function findMatch() {
      ws.send(JSON.stringify({ type: "JOIN_QUEUE" }));
      document.getElementById("find-btn").classList.remove("hidden");
      document.getElementById("find-btn").disabled = true;
      document.getElementById("search-spinner").classList.remove("hidden");
      document.getElementById("scoreboard-card").classList.add("hidden");
      document.getElementById("chat-card").classList.add("hidden");
      document.getElementById("retry-btn").classList.add("hidden");
      document.getElementById("new-opp-btn").classList.add("hidden");
      document.getElementById("board").classList.add("hidden");
      document.getElementById("retry-msg").innerText = "";
      updateStatus("Searching for another player...");
    }

    function requestRetry() {
      ws.send(JSON.stringify({ type: "RETRY" }));
      document.getElementById("retry-btn").disabled = true;
      updateStatus("Waiting for opponent to accept rematch...");
    }

    function makeMove(position) {
      if (currentTurn !== mySymbol) return;
      ws.send(JSON.stringify({ type: "MOVE", position }));
    }

    function renderBoard(board) {
      const cells = document.querySelectorAll(".cell");
      board.forEach((val, i) => {
        cells[i].className = "cell";
        if (val === "X") {
          cells[i].innerHTML = svgIconX;
          cells[i].classList.add("pop-x");
        } else if (val === "O") {
          cells[i].innerHTML = svgIconO;
          cells[i].classList.add("pop-o");
        } else {
          cells[i].innerHTML = "";
        }
      });
    }

    function updateStatus(txt) {
      document.getElementById("status").innerText = txt;
    }

    function triggerFireworks() {
      const canvas = document.getElementById("confetti-canvas");
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = [];
      const colors = ['#38bdf8', '#06b6d4', '#ec4899', '#10b981', '#f59e0b', '#ffffff'];

      for (let i = 0; i < 120; i++) {
        particles.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          vx: (Math.random() - 0.5) * 14,
          vy: (Math.random() - 0.7) * 16,
          size: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1,
          decay: Math.random() * 0.015 + 0.008
        });
      }

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let active = false;

        particles.forEach(p => {
          if (p.alpha > 0) {
            active = true;
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.25;
            p.alpha -= p.decay;

            ctx.globalAlpha = Math.max(p.alpha, 0);
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, p.size, p.size);
          }
        });

        if (active) {
          requestAnimationFrame(render);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }

      render();
    }
  </script>
</body>
</html>
