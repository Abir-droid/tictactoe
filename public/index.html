<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyberpunk Tic Tac Toe</title>
  <style>
    /* Dark Theme Palette (Default) */
    [data-theme="dark"] {
      --bg-color: #090d16;
      --bg-gradient: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #090d16 80%);
      --card-bg: rgba(22, 31, 49, 0.8);
      --card-border: rgba(255, 255, 255, 0.1);
      --input-bg: rgba(15, 23, 42, 0.6);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --heading-gradient: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
      --btn-sec-bg: rgba(255, 255, 255, 0.08);
      --btn-sec-hover: rgba(255, 255, 255, 0.15);
      --cell-bg: rgba(30, 41, 59, 0.7);
      --cell-hover: rgba(51, 65, 85, 0.8);
      --table-header: rgba(15, 23, 42, 0.8);
      --accent-blue: #38bdf8;
      --accent-cyan: #06b6d4;
      --accent-pink: #ec4899;
      --accent-green: #10b981;
      --accent-amber: #f59e0b;
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    /* Light Theme Palette */
    [data-theme="light"] {
      --bg-color: #f1f5f9;
      --bg-gradient: radial-gradient(circle at 50% 20%, #e2e8f0 0%, #cbd5e1 80%);
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(0, 0, 0, 0.08);
      --input-bg: rgba(241, 245, 249, 0.9);
      --text-main: #0f172a;
      --text-muted: #475569;
      --heading-gradient: linear-gradient(135deg, #0f172a 0%, #334155 100%);
      --btn-sec-bg: rgba(0, 0, 0, 0.06);
      --btn-sec-hover: rgba(0, 0, 0, 0.12);
      --cell-bg: rgba(226, 232, 240, 0.8);
      --cell-hover: rgba(203, 213, 225, 1);
      --table-header: rgba(226, 232, 240, 0.9);
      --accent-blue: #0284c7;
      --accent-cyan: #0891b2;
      --accent-pink: #db2777;
      --accent-green: #059669;
      --accent-amber: #d97706;
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
    }

    * {
      box-sizing: border-box;
      transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease, transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: var(--bg-gradient);
      color: var(--text-main);
      margin: 0;
      padding: 1.5rem;
      overflow-x: hidden;
      position: relative;
    }

    /* Floating Theme Switcher Button */
    .theme-toggle-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow);
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 6px;
      width: auto;
      margin-top: 0;
    }

    .theme-toggle-btn:hover {
      transform: scale(1.05);
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      padding: 2.2rem;
      border-radius: 20px;
      box-shadow: var(--shadow);
      text-align: center;
      width: 360px;
      animation: fadeInSlide 0.4s ease-out forwards;
    }

    @keyframes fadeInSlide {
      from { opacity: 0; transform: translateY(15px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    h2 {
      margin-top: 0;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: var(--heading-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      margin-top: 10px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: var(--input-bg);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
    }

    input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border-radius: 10px;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button.btn-sec {
      background: var(--btn-sec-bg);
      color: var(--text-main);
      box-shadow: none;
      border: 1px solid var(--card-border);
    }

    button.btn-sec:hover:not(:disabled) {
      background: var(--btn-sec-hover);
    }

    button:disabled {
      background: #94a3b8;
      color: #cbd5e1;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-retry { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
    .btn-new { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }

    .link-btn {
      display: inline-block;
      margin-top: 14px;
      color: var(--accent-blue);
      text-decoration: none;
      font-size: 0.88rem;
      cursor: pointer;
      font-weight: 500;
    }

    .link-btn:hover {
      text-decoration: underline;
    }

    /* Searching Spinner */
    .search-loader {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-radius: 50%;
      border-top-color: var(--accent-blue);
      animation: spin 1s infinite linear;
      margin: 15px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Board & Cells */
    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 20px;
    }

    .cell {
      width: 90px;
      height: 90px;
      background: var(--cell-bg);
      border: 1px solid var(--card-border);
      font-size: 2.8rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 14px;
      user-select: none;
    }

    .cell:hover {
      background: var(--cell-hover);
      transform: scale(1.03);
    }

    .cell.pop-x {
      color: var(--accent-cyan);
      text-shadow: 0 0 15px rgba(6, 182, 212, 0.5);
      animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .cell.pop-o {
      color: var(--accent-pink);
      text-shadow: 0 0 15px rgba(236, 72, 153, 0.5);
      animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Leaderboard */
    .leaderboard-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 0.85rem;
      border-radius: 10px;
      overflow: hidden;
    }

    .leaderboard-table th, .leaderboard-table td {
      padding: 10px;
      border-bottom: 1px solid var(--card-border);
      text-align: center;
    }

    .leaderboard-table th {
      background: var(--table-header);
      color: var(--accent-blue);
      font-weight: 600;
    }

    .hidden { display: none !important; }
    #status { margin-top: 15px; font-weight: 600; color: var(--accent-blue); }
    #retry-msg { margin-top: 10px; font-size: 0.9rem; color: var(--accent-amber); }
  </style>
</head>
<body>

  <!-- Floating Theme Switcher Button -->
  <button class="theme-toggle-btn" onclick="toggleTheme()">
    <span id="theme-icon">☀️</span> <span id="theme-text">Light Mode</span>
  </button>

  <!-- LOGIN -->
  <div class="card" id="login-view">
    <h2>Login</h2>
    <input type="text" id="login-username" placeholder="Username" />
    <input type="password" id="login-password" placeholder="Password" />
    <button onclick="login()">Login</button>
    <div>
      <a class="link-btn" onclick="showView('register-view')">Create new account</a>
    </div>
  </div>

  <!-- REGISTER -->
  <div class="card hidden" id="register-view">
    <h2>Create Account</h2>
    <input type="text" id="reg-username" placeholder="Username" />
    <input type="password" id="reg-password" placeholder="Password" />
    <button onclick="register()">Register / Create Account</button>
    <div>
      <a class="link-btn" onclick="showView('login-view')">Already have an account? Login</a>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div class="card hidden" id="dashboard-view">
    <h2 style="margin-bottom: 2px;">Welcome</h2>
    <div id="user-display" style="color: var(--accent-cyan); font-weight: 700; font-size: 1.25rem; margin-bottom: 15px;"></div>

    <button onclick="startNewGame()">New Game 🎮</button>
    <button class="btn-sec" onclick="logout()">Logout 🚪</button>

    <h3 style="margin-top: 24px; margin-bottom: 8px; font-size: 1rem; color: var(--text-muted);">🏆 Global Leaderboard</h3>
    <table class="leaderboard-table">
      <thead>
        <tr>
          <th>Player</th>
          <th>W</th>
          <th>L</th>
          <th>D</th>
        </tr>
      </thead>
      <tbody id="leaderboard-body">
        <tr><td colspan="4">Loading...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- GAME SECTION -->
  <div class="card hidden" id="game-view">
    <button class="btn-sec" style="margin-bottom: 12px;" onclick="returnToDashboard()">← Back to Dashboard</button>
    
    <div id="search-spinner" class="search-loader hidden"></div>
    <div id="status">Click to Search Player</div>
    <div id="retry-msg"></div>
    
    <button id="find-btn" onclick="findMatch()">Find Opponent</button>
    <button id="retry-btn" class="btn-retry hidden" onclick="requestRetry()">Play Again 🔄</button>
    <button id="new-opp-btn" class="btn-new hidden" onclick="findMatch()">Find New Opponent 🔍</button>

    <div class="board hidden" id="board">
      <div class="cell" onclick="makeMove(0)"></div>
      <div class="cell" onclick="makeMove(1)"></div>
      <div class="cell" onclick="makeMove(2)"></div>
      <div class="cell" onclick="makeMove(3)"></div>
      <div class="cell" onclick="makeMove(4)"></div>
      <div class="cell" onclick="makeMove(5)"></div>
      <div class="cell" onclick="makeMove(6)"></div>
      <div class="cell" onclick="makeMove(7)"></div>
      <div class="cell" onclick="makeMove(8)"></div>
    </div>
  </div>

  <script>
    let ws;
    let myUsername = "";
    let mySymbol = "";
    let currentTurn = "";

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute("data-theme");
      const next = current === "dark" ? "light" : "dark";
      
      html.setAttribute("data-theme", next);
      document.getElementById("theme-icon").innerText = next === "dark" ? "☀️" : "🌙";
      document.getElementById("theme-text").innerText = next === "dark" ? "Light Mode" : "Dark Mode";
    }

    function showView(viewId) {
      document.getElementById("login-view").classList.add("hidden");
      document.getElementById("register-view").classList.add("hidden");
      document.getElementById("dashboard-view").classList.add("hidden");
      document.getElementById("game-view").classList.add("hidden");

      const target = document.getElementById(viewId);
      target.classList.remove("hidden");
      target.style.animation = 'none';
      target.offsetHeight;
      target.style.animation = null;
    }

    async function login() {
      const user = document.getElementById("login-username").value.trim();
      const pass = document.getElementById("login-password").value.trim();
      if (!user || !pass) return alert("Enter both username and password");

      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: user, password: pass })
      });

      if (res.ok) {
        myUsername = user;
        openDashboard();
      } else {
        const err = await res.text();
        alert(err);
      }
    }

    async function register() {
      const user = document.getElementById("reg-username").value.trim();
      const pass = document.getElementById("reg-password").value.trim();
      if (!user || !pass) return alert("Enter both username and password");

      const res = await fetch("/api/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: user, password: pass })
      });

      if (res.ok) {
        myUsername = user;
        openDashboard();
      } else {
        const err = await res.text();
        alert(err);
      }
    }

    function openDashboard() {
      document.getElementById("user-display").innerText = myUsername;
      showView("dashboard-view");
      loadLeaderboard();
      connectWebSocket();
    }

    async function loadLeaderboard() {
      const tbody = document.getElementById("leaderboard-body");
      tbody.innerHTML = '<tr><td colspan="4">Loading...</td></tr>';

      try {
        const res = await fetch("/api/leaderboard");
        const data = await res.json();

        if (data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4">No games played yet</td></tr>';
          return;
        }

        tbody.innerHTML = data.map(player => `
          <tr>
            <td><strong>${player.username}</strong></td>
            <td style="color: var(--accent-green);">${player.wins}</td>
            <td style="color: #ef4444;">${player.losses}</td>
            <td style="color: var(--accent-amber);">${player.draws}</td>
          </tr>
        `).join('');
      } catch (e) {
        tbody.innerHTML = '<tr><td colspan="4">Failed to load</td></tr>';
      }
    }

    function connectWebSocket() {
      if (ws && ws.readyState === WebSocket.OPEN) return;

      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${location.host}/ws?username=${myUsername}`);

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);

        switch (msg.type) {
          case "MATCH_FOUND":
            setupMatch(msg);
            break;

          case "GAME_STATE":
            currentTurn = msg.turn;
            renderBoard(msg.board);
            updateStatus(`You are [${mySymbol}]. Current Turn: ${currentTurn}`);
            break;

          case "GAME_OVER":
            renderBoard(msg.board);
            if (msg.winner === "DRAW") {
              updateStatus("Game Over: It's a Draw!");
            } else if (msg.winner === mySymbol) {
              updateStatus("🎉 Victory!");
            } else {
              updateStatus("❌ Defeat!");
            }
            document.getElementById("retry-btn").classList.remove("hidden");
            document.getElementById("retry-btn").disabled = false;
            document.getElementById("new-opp-btn").classList.remove("hidden");
            break;

          case "RETRY_REQUESTED":
            document.getElementById("retry-msg").innerText = msg.message;
            break;

          case "RESTART_GAME":
            document.getElementById("retry-btn").classList.add("hidden");
            document.getElementById("new-opp-btn").classList.add("hidden");
            document.getElementById("retry-msg").innerText = "";
            mySymbol = msg.symbol;
            currentTurn = msg.turn;
            renderBoard(msg.board);
            updateStatus(`Rematch Started! You are [${mySymbol}]. Turn: ${currentTurn}`);
            break;

          case "OPPONENT_LEFT":
            updateStatus(msg.message);
            document.getElementById("board").classList.add("hidden");
            document.getElementById("retry-btn").classList.add("hidden");
            document.getElementById("new-opp-btn").classList.add("hidden");
            document.getElementById("find-btn").classList.remove("hidden");
            document.getElementById("find-btn").disabled = false;
            document.getElementById("search-spinner").classList.add("hidden");
            document.getElementById("retry-msg").innerText = "";
            break;

          case "ERROR":
            alert(msg.error);
            break;
        }
      };
    }

    function startNewGame() {
      showView("game-view");
      resetGameUI();
    }

    function returnToDashboard() {
      showView("dashboard-view");
      loadLeaderboard();
      resetGameUI();
    }

    function logout() {
      if (ws) {
        ws.close();
      }
      myUsername = "";
      document.getElementById("login-username").value = "";
      document.getElementById("login-password").value = "";
      document.getElementById("reg-username").value = "";
      document.getElementById("reg-password").value = "";
      showView("login-view");
    }

    function resetGameUI() {
      document.getElementById("board").classList.add("hidden");
      document.getElementById("retry-btn").classList.add("hidden");
      document.getElementById("new-opp-btn").classList.add("hidden");
      document.getElementById("search-spinner").classList.add("hidden");
      document.getElementById("find-btn").classList.remove("hidden");
      document.getElementById("find-btn").disabled = false;
      document.getElementById("retry-msg").innerText = "";
      updateStatus("Click to Search Player");
    }

    function setupMatch(msg) {
      mySymbol = msg.symbol;
      currentTurn = msg.turn;
      document.getElementById("search-spinner").classList.add("hidden");
      document.getElementById("find-btn").classList.add("hidden");
      document.getElementById("retry-btn").classList.add("hidden");
      document.getElementById("new-opp-btn").classList.add("hidden");
      document.getElementById("board").classList.remove("hidden");
      document.getElementById("retry-msg").innerText = "";
      renderBoard(["", "", "", "", "", "", "", "", ""]);
      updateStatus(`Matched vs ${msg.opponent}! You are [${mySymbol}]. Turn: ${currentTurn}`);
    }

    function findMatch() {
      ws.send(JSON.stringify({ type: "JOIN_QUEUE" }));
      document.getElementById("find-btn").classList.remove("hidden");
      document.getElementById("find-btn").disabled = true;
      document.getElementById("search-spinner").classList.remove("hidden");
      document.getElementById("retry-btn").classList.add("hidden");
      document.getElementById("new-opp-btn").classList.add("hidden");
      document.getElementById("board").classList.add("hidden");
      document.getElementById("retry-msg").innerText = "";
      updateStatus("Searching for another player...");
    }

    function requestRetry() {
      ws.send(JSON.stringify({ type: "RETRY" }));
      document.getElementById("retry-btn").disabled = true;
      updateStatus("Waiting for opponent to accept rematch...");
    }

    function makeMove(position) {
      if (currentTurn !== mySymbol) return;
      ws.send(JSON.stringify({ type: "MOVE", position }));
    }

    function renderBoard(board) {
      const cells = document.querySelectorAll(".cell");
      board.forEach((val, i) => {
        cells[i].innerText = val;
        cells[i].className = "cell";
        if (val === "X") cells[i].classList.add("pop-x");
        if (val === "O") cells[i].classList.add("pop-o");
      });
    }

    function updateStatus(txt) {
      document.getElementById("status").innerText = txt;
    }
  </script>
</body>
</html>
