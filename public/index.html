<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Realtime Tic Tac Toe</title>
  <script>
    if (!window.location.pathname.endsWith('/') && !window.location.pathname.endsWith('.html')) {
      window.location.replace(window.location.pathname + '/' + window.location.search + window.location.hash);
    }
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <canvas id="confetti-canvas"></canvas>

  <div id="top-left-nav" class="top-left-nav hidden">
    <button class="btn-sec" onclick="returnToDashboard()">← Back to Dashboard</button>
  </div>

  <!-- Minimal Icon Theme Switcher -->
  <button class="theme-toggle-btn" onclick="toggleTheme()" id="theme-btn" aria-label="Toggle Theme">
    <svg id="icon-sun" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--sun-color)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
    <svg id="icon-moon" class="hidden" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--moon-color)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
  </button>

  <!-- LOGIN -->
  <div class="card" id="login-view">
    <h2>Login</h2>
    <input type="text" id="login-username" placeholder="Username" />
    <input type="password" id="login-password" placeholder="Password" />
    <button onclick="login()">Login</button>
    <div>
      <a class="link-btn" onclick="showView('register-view')">Create new account</a>
    </div>
  </div>

  <!-- REGISTER -->
  <div class="card hidden" id="register-view">
    <h2>Create Account</h2>
    <input type="text" id="reg-username" placeholder="Username" />
    <input type="password" id="reg-password" placeholder="Password" />
    <button onclick="register()">Register Account</button>
    <div>
      <a class="link-btn" onclick="showView('login-view')">Already have an account? Login</a>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div class="card hidden" id="dashboard-view">
    <div id="user-display" style="color: var(--accent-cyan); font-weight: 700; font-size: 1.25rem; margin-bottom: 8px;"></div>

    <!-- Active Ongoing Game Banner -->
    <div id="rejoin-banner" class="rejoin-banner hidden">
      <span>🎮 Ongoing match vs <strong id="rejoin-opp-name">Opponent</strong></span>
      <button class="btn-retry" style="margin-top: 6px;" onclick="rejoinOngoingGame()">Rejoin Game ⚡</button>
    </div>

    <div class="profile-stats-grid">
      <div class="stat-badge">
        <span id="prof-wins" class="stat-val" style="color: var(--accent-green);">0</span>
        <span class="stat-label">Wins</span>
      </div>
      <div class="stat-badge">
        <span id="prof-losses" class="stat-val" style="color: #ef4444;">0</span>
        <span class="stat-label">Losses</span>
      </div>
      <div class="stat-badge">
        <span id="prof-draws" class="stat-val" style="color: var(--accent-amber);">0</span>
        <span class="stat-label">Draws</span>
      </div>
      <div class="stat-badge">
        <span id="prof-total" class="stat-val" style="color: var(--accent-blue);">0</span>
        <span class="stat-label">Total</span>
      </div>
    </div>

    <button onclick="startNewGame()">New Game</button>
    <button class="btn-sec" style="width: 100%; margin-top: 10px;" onclick="logout()">Logout</button>

    <h3 style="margin-top: 20px; margin-bottom: 6px; font-size: 0.95rem; color: var(--text-muted);">🏆 Top 10 Leaderboard</h3>
    <table class="leaderboard-table">
      <thead>
        <tr>
          <th>Player</th>
          <th>W</th>
          <th>L</th>
          <th>D</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody id="leaderboard-body">
        <tr><td colspan="5">Loading...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- SEPARATE LIVE SCOREBOARD CARD -->
  <div id="scoreboard-card" class="card scoreboard-card hidden">
    <div class="scoreboard">
      <div class="player-card">
        <div class="player-avatar" id="sb-p1-avatar">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </div>
        <div class="player-details">
          <span id="sb-p1-name" class="player-name">You</span>
          <span id="sb-p1-sym" class="player-tag tag-x">Symbol X</span>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 4px;">
        <span id="sb-p1-score" class="score-badge">0</span>
        <span class="vs-divider">:</span>
        <span id="sb-p2-score" class="score-badge">0</span>
      </div>

      <div class="player-card">
        <div class="player-details right">
          <span id="sb-p2-name" class="player-name">Opponent</span>
          <span id="sb-p2-sym" class="player-tag tag-o">Symbol O</span>
        </div>
        <div class="player-avatar" id="sb-p2-avatar">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 1-3-3.87"></path><path d="M4 21v-2a4 4 0 0 1 3-3.87"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </div>
      </div>
    </div>
  </div>

  <!-- MAIN CENTERED GAME CARD -->
  <div class="card hidden" id="game-view">
    <div id="search-spinner" class="search-loader hidden"></div>
    <div id="status">Searching for another player...</div>
    <div id="retry-msg"></div>
    
    <button id="retry-btn" class="btn-retry hidden" onclick="requestRetry()">Play Again 🔄</button>
    <button id="new-opp-btn" class="btn-new hidden" onclick="findMatch()">Find New Opponent 🔍</button>

    <div class="board hidden" id="board">
      <!-- Animated SVG Winning Line Overlay -->
      <svg id="win-line-svg" class="win-line-svg hidden">
        <line id="win-line" class="win-line" x1="0" y1="0" x2="0" y2="0" />
      </svg>

      <div class="cell" onclick="makeMove(0)"></div>
      <div class="cell" onclick="makeMove(1)"></div>
      <div class="cell" onclick="makeMove(2)"></div>
      <div class="cell" onclick="makeMove(3)"></div>
      <div class="cell" onclick="makeMove(4)"></div>
      <div class="cell" onclick="makeMove(5)"></div>
      <div class="cell" onclick="makeMove(6)"></div>
      <div class="cell" onclick="makeMove(7)"></div>
      <div class="cell" onclick="makeMove(8)"></div>
    </div>
  </div>

  <!-- FREELY DRAGGABLE CHAT WINDOW -->
  <div id="chat-card" class="card chat-card hidden">
    <div class="chat-header-bar" id="chat-header">
      <span class="chat-header-title">✋ 💬 Match Chat</span>
      <button class="chat-close-btn" onclick="toggleChatDrawer(false)">✕</button>
    </div>
    <div id="chat-messages" class="chat-messages"></div>
    
    <div class="emoji-bar">
      <span class="emoji-pill" onclick="quickSendEmoji('👍')">👍</span>
      <span class="emoji-pill" onclick="quickSendEmoji('😎')">😎</span>
      <span class="emoji-pill" onclick="quickSendEmoji('🔥')">🔥</span>
      <span class="emoji-pill" onclick="quickSendEmoji('👏')">👏</span>
      <span class="emoji-pill" onclick="quickSendEmoji('😂')">😂</span>
      <span class="emoji-pill" onclick="quickSendEmoji('🎯')">🎯</span>
      <span class="emoji-pill" onclick="quickSendEmoji('GG')">GG</span>
    </div>

    <div class="chat-input-row">
      <input type="text" id="chat-input" placeholder="Message..." onkeydown="if(event.key==='Enter') sendChat()" />
      <button onclick="sendChat()">Send</button>
    </div>
  </div>

  <!-- FLOATING CHAT PREVIEW POPUP -->
  <div id="chat-popup" class="chat-popup hidden">
    <div id="popup-sender" class="chat-popup-sender"></div>
    <div id="popup-text"></div>
  </div>

  <!-- FLOATING CHAT ICON TOGGLE -->
  <button id="chat-toggle-btn" class="chat-drawer-toggle hidden" onclick="toggleChatDrawer()">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent-blue)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
  </button>

  <script src="script.js"></script>
</body>
</html>
