<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER TAC TOE</title>
  <style>
    /* Dark Theme Palette (Default) */
    [data-theme="dark"] {
      --bg-color: #090d16;
      --bg-gradient: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #090d16 80%);
      --card-bg: rgba(22, 31, 49, 0.8);
      --card-border: rgba(255, 255, 255, 0.1);
      --input-bg: rgba(15, 23, 42, 0.6);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --heading-gradient: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
      --btn-sec-bg: rgba(255, 255, 255, 0.08);
      --btn-sec-hover: rgba(255, 255, 255, 0.15);
      --cell-bg: rgba(30, 41, 59, 0.7);
      --cell-hover: rgba(51, 65, 85, 0.8);
      --table-header: rgba(15, 23, 42, 0.8);
      --accent-blue: #38bdf8;
      --accent-cyan: #06b6d4;
      --accent-pink: #ec4899;
      --accent-green: #10b981;
      --accent-amber: #f59e0b;
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      --sun-color: #f59e0b;
      --moon-color: #f59e0b;
      --chat-my-msg: #0284c7;
      --chat-opp-msg: #334155;
    }

    /* Light Theme Palette */
    [data-theme="light"] {
      --bg-color: #f1f5f9;
      --bg-gradient: radial-gradient(circle at 50% 20%, #e2e8f0 0%, #cbd5e1 80%);
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(0, 0, 0, 0.08);
      --input-bg: rgba(241, 245, 249, 0.9);
      --text-main: #0f172a;
      --text-muted: #475569;
      --heading-gradient: linear-gradient(135deg, #0f172a 0%, #334155 100%);
      --btn-sec-bg: rgba(0, 0, 0, 0.06);
      --btn-sec-hover: rgba(0, 0, 0, 0.12);
      --cell-bg: rgba(226, 232, 240, 0.8);
      --cell-hover: rgba(203, 213, 225, 1);
      --table-header: rgba(226, 232, 240, 0.9);
      --accent-blue: #0284c7;
      --accent-cyan: #0891b2;
      --accent-pink: #db2777;
      --accent-green: #059669;
      --accent-amber: #d97706;
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
      --sun-color: #d97706;
      --moon-color: #d97706;
      --chat-my-msg: #0284c7;
      --chat-opp-msg: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease, transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: var(--bg-gradient);
      color: var(--text-main);
      margin: 0;
      padding: 1.5rem;
      overflow-x: hidden;
      position: relative;
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 4px; }

    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }

    /* Standalone Title Branding Outside Cards */
    .hero-title {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--accent-blue) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 20px;
      text-shadow: 0 0 25px rgba(56, 189, 248, 0.2);
    }

    /* Top Left Nav */
    .top-left-nav {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 1000;
    }

    .theme-toggle-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: var(--shadow);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 0;
    }

    .theme-toggle-btn:hover {
      transform: scale(1.1);
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      padding: 2rem;
      border-radius: 20px;
      box-shadow: var(--shadow);
      text-align: center;
      width: 380px;
      animation: fadeInSlide 0.4s ease-out forwards;
    }

    @keyframes fadeInSlide {
      from { opacity: 0; transform: translateY(15px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    h2 {
      margin-top: 0;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: var(--heading-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      margin-top: 10px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: var(--input-bg);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
    }

    input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border-radius: 10px;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button.btn-sec {
      background: var(--btn-sec-bg);
      color: var(--text-main);
      box-shadow: none;
      border: 1px solid var(--card-border);
      width: auto;
      padding: 8px 16px;
    }

    button.btn-sec:hover:not(:disabled) {
      background: var(--btn-sec-hover);
    }

    button:disabled {
      background: #94a3b8;
      color: #cbd5e1;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-retry { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
    .btn-new { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }

    .link-btn {
      display: inline-block;
      margin-top: 14px;
      color: var(--accent-blue);
      text-decoration: none;
      font-size: 0.88rem;
      cursor: pointer;
      font-weight: 500;
    }

    .link-btn:hover {
      text-decoration: underline;
    }

    /* Profile Stats Panel */
    .profile-stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 12px 0 18px 0;
    }

    .stat-badge {
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 8px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-val {
      font-weight: 800;
      font-size: 1.1rem;
    }

    .stat-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
      margin-top: 2px;
    }

    /* Scoreboard Box */
    .scoreboard-card {
      width: 380px;
      margin-bottom: 16px;
      padding: 1.2rem;
    }

    .scoreboard {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .player-card {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .player-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--btn-sec-bg);
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .player-details {
      display: flex;
      flex-direction: column;
      text-align: left;
    }

    .player-details.right {
      text-align: right;
    }

    .player-name {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-main);
      max-width: 80px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .player-tag {
      font-size: 0.75rem;
      font-weight: 600;
    }

    .tag-x { color: var(--accent-cyan); }
    .tag-o { color: var(--accent-pink); }

    .score-badge {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--text-main);
      padding: 0 6px;
    }

    .vs-divider {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--text-muted);
      opacity: 0.6;
    }

    /* Game Layout Wrapper (Fixed Centered Game Box) */
    .game-wrapper {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
      max-width: 1000px;
    }

    /* Desktop Absolute Positioned Left Chat Drawer */
    .chat-card {
      position: absolute;
      right: calc(50% + 210px);
      top: 0;
      width: 320px;
      padding: 1.2rem;
      text-align: left;
      z-index: 50;
    }

    .chat-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .chat-header-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--accent-blue);
    }

    .chat-close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 0;
      width: auto;
      margin: 0;
      box-shadow: none;
    }

    .chat-close-btn:hover {
      color: var(--text-main);
      transform: none;
    }

    .chat-messages {
      height: 180px;
      overflow-y: auto;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 8px;
      background: var(--input-bg);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .chat-msg {
      max-width: 85%;
      padding: 6px 10px;
      border-radius: 12px;
      font-size: 0.85rem;
      word-break: break-word;
    }

    .chat-msg.me {
      align-self: flex-end;
      background: var(--chat-my-msg);
      color: #fff;
      border-bottom-right-radius: 2px;
    }

    .chat-msg.them {
      align-self: flex-start;
      background: var(--chat-opp-msg);
      color: var(--text-main);
      border-bottom-left-radius: 2px;
    }

    .emoji-bar {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .emoji-pill {
      background: var(--btn-sec-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 0.85rem;
      cursor: pointer;
      user-select: none;
    }

    .emoji-pill:hover {
      background: var(--btn-sec-hover);
      transform: scale(1.1);
    }

    .chat-input-row {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }

    .chat-input-row input {
      margin-top: 0;
      padding: 8px 12px;
      font-size: 0.85rem;
    }

    .chat-input-row button {
      margin-top: 0;
      width: 65px;
      padding: 8px;
      font-size: 0.85rem;
    }

    .chat-drawer-toggle {
      position: fixed;
      bottom: 25px;
      left: 25px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow);
      z-index: 1000;
    }

    .chat-drawer-toggle:hover {
      transform: scale(1.1);
    }

    .chat-popup {
      position: fixed;
      bottom: 85px;
      left: 25px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--accent-blue);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      padding: 10px 14px;
      border-radius: 14px;
      max-width: 260px;
      font-size: 0.85rem;
      color: var(--text-main);
      z-index: 1001;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .chat-popup-sender {
      font-weight: 700;
      color: var(--accent-cyan);
      margin-bottom: 2px;
      font-size: 0.78rem;
    }

    /* Searching Spinner */
    .search-loader {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-radius: 50%;
      border-top-color: var(--accent-blue);
      animation: spin 1s infinite linear;
      margin: 15px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Board & Cells */
    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 15px;
    }

    .cell {
      width: 90px;
      height: 90px;
      background: var(--cell-bg);
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 14px;
      user-select: none;
    }

    .cell:hover {
      background: var(--cell-hover);
      transform: scale(1.03);
    }

    .cell svg {
      width: 42px;
      height: 42px;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .cell.pop-x svg {
      stroke: var(--accent-cyan);
      filter: drop-shadow(0 0 6px rgba(6, 182, 212, 0.6));
      animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .cell.pop-o svg {
      stroke: var(--accent-pink);
      filter: drop-shadow(0 0 6px rgba(236, 72, 153, 0.6));
      animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0.4); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Leaderboard */
    .leaderboard-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: 0.8rem;
      border-radius: 10px;
      overflow: hidden;
    }

    .leaderboard-table th, .leaderboard-table td {
      padding: 8px 4px;
      border-bottom: 1px solid var(--card-border);
      text-align: center;
    }

    .leaderboard-table th {
      background: var(--table-header);
      color: var(--accent-blue);
      font-weight: 600;
    }

    .hidden { display: none !important; }
    #status { margin-top: 10px; font-weight: 600; color: var(--accent-blue); }
    #retry-msg { margin-top: 8px; font-size: 0.9rem; color: var(--accent-amber); }

    /* Mobile Screen Responsive Layout */
    @media (max-width: 900px) {
      body {
        padding-top: 70px;
      }

      .top-left-nav {
        top: 15px;
        left: 15px;
      }

      .theme-toggle-btn {
        top: 15px;
        right: 15px;
      }

      .hero-title {
        font-size: 1.6rem;
        margin-bottom: 10px;
      }

      .scoreboard-card, .card {
        width: 100%;
        max-width: 350px;
      }

      /* Stack Chat Box Over Board on Mobile */
      .chat-card {
        position: fixed;
        right: auto;
        top: auto;
        bottom: 85px;
        left: 50%;
        transform: translateX(-50%);
        width: 90%;
        max-width: 350px;
        z-index: 2000;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
      }
    }
  </style>
</head>
<body>

  <canvas id="confetti-canvas"></canvas>

  <div id="hero-branding" class="hero-title">CYBER TAC TOE</div>

  <div id="top-left-nav" class="top-left-nav hidden">
    <button class="btn-sec" onclick="returnToDashboard()">← Back to Dashboard</button>
  </div>

  <!-- Minimal Icon Theme Switcher -->
  <button class="theme-toggle-btn" onclick="toggleTheme()" id="theme-btn" aria-label="Toggle Theme">
    <svg id="icon-sun" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--sun-color)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
    <svg id="icon-moon" class="hidden" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--moon-color)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
  </button>

  <!-- LOGIN -->
  <div class="card" id="login-view">
    <h2>Login</h2>
    <input type="text" id="login-username" placeholder="Username" />
    <input type="password" id="login-password" placeholder="Password" />
    <button onclick="login()">Login</button>
    <div>
      <a class="link-btn" onclick="showView('register-view')">Create new account</a>
    </div>
  </div>

  <!-- REGISTER -->
  <div class="card hidden" id="register-view">
    <h2>Create Account</h2>
    <input type="text" id="reg-username" placeholder="Username" />
    <input type="password" id="reg-password" placeholder="Password" />
    <button onclick="register()">Register Account</button>
    <div>
      <a class="link-btn" onclick="showView('login-view')">Already have an account? Login</a>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div class="card hidden" id="dashboard-view">
    <div id="user-display" style="color: var(--accent-cyan); font-weight: 700; font-size: 1.25rem; margin-bottom: 8px;"></div>

    <!-- User Profile Stats Panel -->
    <div class="profile-stats-grid">
      <div class="stat-badge">
        <span id="prof-wins" class="stat-val" style="color: var(--accent-green);">0</span>
        <span class="stat-label">Wins</span>
      </div>
      <div class="stat-badge">
        <span id="prof-losses" class="stat-val" style="color: #ef4444;">0</span>
        <span class="stat-label">Losses</span>
      </div>
      <div class="stat-badge">
        <span id="prof-draws" class="stat-val" style="color: var(--accent-amber);">0</span>
        <span class="stat-label">Draws</span>
      </div>
      <div class="stat-badge">
        <span id="prof-total" class="stat-val" style="color: var(--accent-blue);">0</span>
        <span class="stat-label">Total</span>
      </div>
    </div>

    <button onclick="startNewGame()">New Game</button>
    <button class="btn-sec" style="width: 100%; margin-top: 10px;" onclick="logout()">Logout</button>

    <h3 style="margin-top: 20px; margin-bottom: 6px; font-size: 0.95rem; color: var(--text-muted);">🏆 Top 10 Leaderboard</h3>
    <table class="leaderboard-table">
      <thead>
        <tr>
          <th>Player</th>
          <th>W</th>
          <th>L</th>
          <th>D</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody id="leaderboard-body">
        <tr><td colspan="5">Loading...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- SEPARATE LIVE SCOREBOARD CARD -->
  <div id="scoreboard-card" class="card scoreboard-card hidden">
    <div class="scoreboard">
      <div class="player-card">
        <div class="player-avatar">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </div>
        <div class="player-details">
          <span id="sb-p1-name" class="player-name">You</span>
          <span id="sb-p1-sym" class="player-tag tag-x">Symbol X</span>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 4px;">
        <span id="sb-p1-score" class="score-badge">0</span>
        <span class="vs-divider">:</span>
        <span id="sb-p2-score" class="score-badge">0</span>
      </div>

      <div class="player-card">
        <div class="player-details right">
          <span id="sb-p2-name" class="player-name">Opponent</span>
          <span id="sb-p2-sym" class="player-tag tag-o">Symbol O</span>
        </div>
        <div class="player-avatar">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 1-3-3.87"></path><path d="M4 21v-2a4 4 0 0 1 3-3.87"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </div>
      </div>
    </div>
  </div>

  <!-- GAME LAYOUT WRAPPER -->
  <div class="game-wrapper">
    
    <!-- LEFT POSITIONED CHAT CARD -->
    <div id="chat-card" class="card chat-card hidden">
      <div class="chat-header-bar">
        <span class="chat-header-title">💬 Match Chat</span>
        <button class="chat-close-btn" onclick="toggleChatDrawer(false)">✕</button>
      </div>
      <div id="chat-messages" class="chat-messages"></div>
      
      <div class="emoji-bar">
        <span class="emoji-pill" onclick="quickSendEmoji('👍')">👍</span>
        <span class="emoji-pill" onclick="quickSendEmoji('😎')">😎</span>
        <span class="emoji-pill" onclick="quickSendEmoji('🔥')">🔥</span>
        <span class="emoji-pill" onclick="quickSendEmoji('👏')">👏</span>
        <span class="emoji-pill" onclick="quickSendEmoji('😂')">😂</span>
        <span class="emoji-pill" onclick="quickSendEmoji('🎯')">🎯</span>
        <span class="emoji-pill" onclick="quickSendEmoji('GG')">GG</span>
      </div>

      <div class="chat-input-row">
        <input type="text" id="chat-input" placeholder="Message..." onkeydown="if(event.key==='Enter') sendChat()" />
        <button onclick="sendChat()">Send</button>
      </div>
    </div>

    <!-- MAIN CENTERED GAME CARD -->
    <div class="card hidden" id="game-view">
      <div id="search-spinner" class="search-loader hidden"></div>
      <div id="status">Searching for another player...</div>
      <div id="retry-msg"></div>
      
      <button id="retry-btn" class="btn-retry hidden" onclick="requestRetry()">Play Again 🔄</button>
      <button id="new-opp-btn" class="btn-new hidden" onclick="findMatch()">Find New Opponent 🔍</button>

      <div class="board hidden" id="board">
        <div class="cell" onclick="makeMove(0)"></div>
        <div class="cell" onclick="makeMove(1)"></div>
        <div class="cell" onclick="makeMove(2)"></div>
        <div class="cell" onclick="makeMove(3)"></div>
        <div class="cell" onclick="makeMove(4)"></div>
        <div class="cell" onclick="makeMove(5)"></div>
        <div class="cell" onclick="makeMove(6)"></div>
        <div class="cell" onclick="makeMove(7)"></div>
        <div class="cell" onclick="makeMove(8)"></div>
      </div>
    </div>

  </div>

  <!-- FLOATING CHAT PREVIEW POPUP -->
  <div id="chat-popup" class="chat-popup hidden">
    <div id="popup-sender" class="chat-popup-sender"></div>
    <div id="popup-text"></div>
  </div>

  <!-- FLOATING CHAT ICON TOGGLE -->
  <button id="chat-toggle-btn" class="chat-drawer-toggle hidden" onclick="toggleChatDrawer()">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent-blue)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
  </button>

  <script>
    let ws;
    let myUsername = "";
    let mySymbol = "";
    let currentTurn = "";
    let opponentUsername = "";
    let p1SessionScore = 0;
    let p2SessionScore = 0;
    let isChatOpen = false;
    let popupTimer = null;

    const svgIconX = `<svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>`;
    const svgIconO = `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"></circle></svg>`;

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute("data-theme");
      const next = current === "dark" ? "light" : "dark";
      
      html.setAttribute("data-theme", next);
      if (next === "light") {
        document.getElementById("icon-sun").classList.add("hidden");
        document.getElementById("icon-moon").classList.remove("hidden");
      } else {
        document.getElementById("icon-moon").classList.add("hidden");
        document.getElementById("icon-sun").classList.remove("hidden");
      }
    }

    function showView(viewId) {
      document.getElementById("login-view").classList.add("hidden");
      document.getElementById("register-view").classList.add("hidden");
      document.getElementById("dashboard-view").classList.add("hidden");
      document.getElementById("game-view").classList.add("hidden");
      document.getElementById("scoreboard-card").classList.add("hidden");
      document.getElementById("chat-card").classList.add("hidden");
      document.getElementById("chat-toggle-btn").classList.add("hidden");
      document.getElementById("top-left-nav").classList.add("hidden");
      document.getElementById("chat-popup").classList.add("hidden");

      if (viewId === "game-view") {
        document.getElementById("game-view").classList.remove("hidden");
        document.getElementById("top-left-nav").classList.remove("hidden");
      } else {
        document.getElementById(viewId).classList.remove("hidden");
      }
    }

    async function login() {
      const user = document.getElementById("login-username").value.trim();
      const pass = document.getElementById("login-password").value.trim();
      if (!user || !pass) return alert("Enter both username and password");

      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: user, password: pass })
      });

      if (res.ok) {
        myUsername = user;
        openDashboard();
      } else {
        const err = await res.text();
        alert(err);
      }
    }

    async function register() {
      const user = document.getElementById("reg-username").value.trim();
      const pass = document.getElementById("reg-password").value.trim();
      if (!user || !pass) return alert("Enter both username and password");

      const res = await fetch("/api/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: user, password: pass })
      });

      if (res.ok) {
        myUsername = user;
        openDashboard();
      } else {
        const err = await res.text();
        alert(err);
      }
    }

    function openDashboard() {
      document.getElementById("user-display").innerText = myUsername;
      showView("dashboard-view");
      loadLeaderboard();
      loadProfileStats();
      connectWebSocket();
    }

    async function loadProfileStats() {
      try {
        const res = await fetch(`/api/profile?username=${encodeURIComponent(myUsername)}`);
        if (res.ok) {
          const stats = await res.json();
          document.getElementById("prof-wins").innerText = stats.wins;
          document.getElementById("prof-losses").innerText = stats.losses;
          document.getElementById("prof-draws").innerText = stats.draws;
          document.getElementById("prof-total").innerText = stats.total;
        }
      } catch (e) {
        console.error("Failed to load profile stats", e);
      }
    }

    async function loadLeaderboard() {
      const tbody = document.getElementById("leaderboard-body");
      tbody.innerHTML = '<tr><td colspan="5">Loading...</td></tr>';

      try {
        const res = await fetch("/api/leaderboard");
        const data = await res.json();

        if (data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5">No games played yet</td></tr>';
          return;
        }

        tbody.innerHTML = data.map(player => `
          <tr>
            <td><strong>${player.username}</strong></td>
            <td style="color: var(--accent-green);">${player.wins}</td>
            <td style="color: #ef4444;">${player.losses}</td>
            <td style="color: var(--accent-amber);">${player.draws}</td>
            <td style="color: var(--accent-blue); font-weight: 700;">${player.total}</td>
          </tr>
        `).join('');
      } catch (e) {
        tbody.innerHTML = '<tr><td colspan="5">Failed to load</td></tr>';
      }
    }

    function connectWebSocket() {
      if (ws && ws.readyState === WebSocket.OPEN) return;

      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${location.host}/ws?username=${myUsername}`);

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);

        switch (msg.type) {
          case "MATCH_FOUND":
            p1SessionScore = 0;
            p2SessionScore = 0;
            setupMatch(msg);
            break;

          case "GAME_STATE":
            currentTurn = msg.turn;
            renderBoard(msg.board);
            updateStatus(`Turn: Player [${currentTurn}]`);
            break;

          case "GAME_OVER":
            renderBoard(msg.board);
            if (msg.winner === "DRAW") {
              updateStatus("Game Over: It's a Draw!");
            } else if (msg.winner === mySymbol) {
              p1SessionScore++;
              updateStatus("🎉 Victory!");
              triggerFireworks();
            } else {
              p2SessionScore++;
              updateStatus("❌ Defeat!");
            }
            updateScoreboard();
            document.getElementById("retry-btn").classList.remove("hidden");
            document.getElementById("retry-btn").disabled = false;
            document.getElementById("new-opp-btn").classList.remove("hidden");
            break;

          case "RETRY_REQUESTED":
            document.getElementById("retry-msg").innerText = msg.message;
            break;

          case "RESTART_GAME":
            document.getElementById("retry-btn").classList.add("hidden");
            document.getElementById("new-opp-btn").classList.add("hidden");
            document.getElementById("retry-msg").innerText = "";
            mySymbol = msg.symbol;
            currentTurn = msg.turn;
            updateScoreboard();
            renderBoard(msg.board);
            updateStatus(`Rematch Started! Turn: Player [${currentTurn}]`);
            break;

          case "CHAT":
            appendChatMessage(msg.sender, msg.message);
            break;

          case "OPPONENT_LEFT":
            updateStatus(msg.message);
            document.getElementById("board").classList.add("hidden");
            document.getElementById("scoreboard-card").classList.add("hidden");
            document.getElementById("chat-card").classList.add("hidden");
            document.getElementById("chat-toggle-btn").classList.add("hidden");
            document.getElementById("retry-btn").classList.add("hidden");
            document.getElementById("new-opp-btn").classList.add("hidden");
            document.getElementById("search-spinner").classList.add("hidden");
            document.getElementById("retry-msg").innerText = "";
            break;

          case "ERROR":
            alert(msg.error);
            break;
        }
      };

      ws.onclose = () => {
        console.log("WebSocket disconnected. Retrying in 3 seconds...");
        setTimeout(() => {
          if (myUsername) connectWebSocket();
        }, 3000);
      };
    }

    function startNewGame() {
      showView("game-view");
      resetGameUI();
      findMatch();
    }

    function returnToDashboard() {
      showView("dashboard-view");
      loadLeaderboard();
      loadProfileStats();
      resetGameUI();
    }

    function logout() {
      if (ws) {
        ws.onclose = null;
        ws.close();
      }
      myUsername = "";
      document.getElementById("login-username").value = "";
      document.getElementById("login-password").value = "";
      document.getElementById("reg-username").value = "";
      document.getElementById("reg-password").value = "";
      showView("login-view");
    }

    function resetGameUI() {
      document.getElementById("board").classList.add("hidden");
      document.getElementById("scoreboard-card").classList.add("hidden");
      document.getElementById("chat-card").classList.add("hidden");
      document.getElementById("chat-toggle-btn").classList.add("hidden");
      document.getElementById("retry-btn").classList.add("hidden");
      document.getElementById("new-opp-btn").classList.add("hidden");
      document.getElementById("search-spinner").classList.add("hidden");
      document.getElementById("retry-msg").innerText = "";
      document.getElementById("chat-messages").innerHTML = "";
      isChatOpen = false;
      updateStatus("Searching for another player...");
    }

    function setupMatch(msg) {
      mySymbol = msg.symbol;
      currentTurn = msg.turn;
      opponentUsername = msg.opponent;

      document.getElementById("search-spinner").classList.add("hidden");
      document.getElementById("retry-btn").classList.add("hidden");
      document.getElementById("new-opp-btn").classList.add("hidden");
      document.getElementById("board").classList.remove("hidden");
      document.getElementById("scoreboard-card").classList.remove("hidden");
      document.getElementById("chat-toggle-btn").classList.remove("hidden");
      document.getElementById("retry-msg").innerText = "";
      document.getElementById("chat-messages").innerHTML = "";

      updateScoreboard();
      renderBoard(["", "", "", "", "", "", "", "", ""]);
      updateStatus(`Matched vs ${msg.opponent}! Turn: Player [${currentTurn}]`);
    }

    function updateScoreboard() {
      document.getElementById("sb-p1-name").innerText = myUsername;
      document.getElementById("sb-p1-sym").innerText = `[${mySymbol}]`;
      document.getElementById("sb-p1-sym").className = `player-tag ${mySymbol === 'X' ? 'tag-x' : 'tag-o'}`;
      document.getElementById("sb-p1-score").innerText = p1SessionScore;

      const oppSymbol = mySymbol === 'X' ? 'O' : 'X';
      document.getElementById("sb-p2-name").innerText = opponentUsername;
      document.getElementById("sb-p2-sym").innerText = `[${oppSymbol}]`;
      document.getElementById("sb-p2-sym").className = `player-tag ${oppSymbol === 'X' ? 'tag-x' : 'tag-o'}`;
      document.getElementById("sb-p2-score").innerText = p2SessionScore;
    }

    function toggleChatDrawer(forcedState) {
      if (typeof forcedState === 'boolean') {
        isChatOpen = forcedState;
      } else {
        isChatOpen = !isChatOpen;
      }

      const chatCard = document.getElementById("chat-card");
      if (isChatOpen) {
        chatCard.classList.remove("hidden");
        document.getElementById("chat-popup").classList.add("hidden");
      } else {
        chatCard.classList.add("hidden");
      }
    }

    function sendChat() {
      const input = document.getElementById("chat-input");
      const text = input.value.trim();
      if (!text || !ws) return;

      ws.send(JSON.stringify({ type: "CHAT", message: text }));
      input.value = "";
    }

    function quickSendEmoji(emoji) {
      if (!ws) return;
      ws.send(JSON.stringify({ type: "CHAT", message: emoji }));
    }

    function appendChatMessage(sender, text) {
      const container = document.getElementById("chat-messages");
      const isMe = sender === myUsername;

      const msgDiv = document.createElement("div");
      msgDiv.className = `chat-msg ${isMe ? "me" : "them"}`;
      msgDiv.innerText = isMe ? text : `${sender}: ${text}`;

      container.appendChild(msgDiv);
      container.scrollTop = container.scrollHeight;

      if (!isMe && !isChatOpen) {
        showChatPopup(sender, text);
      }
    }

    function showChatPopup(sender, text) {
      const popup = document.getElementById("chat-popup");
      document.getElementById("popup-sender").innerText = sender;
      document.getElementById("popup-text").innerText = text;

      popup.classList.remove("hidden");

      if (popupTimer) clearTimeout(popupTimer);
      popupTimer = setTimeout(() => {
        popup.classList.add("hidden");
      }, 4000);
    }

    function findMatch() {
      ws.send(JSON.stringify({ type: "JOIN_QUEUE" }));
      document.getElementById("search-spinner").classList.remove("hidden");
      document.getElementById("scoreboard-card").classList.add("hidden");
      document.getElementById("chat-card").classList.add("hidden");
      document.getElementById("chat-toggle-btn").classList.add("hidden");
      document.getElementById("retry-btn").classList.add("hidden");
      document.getElementById("new-opp-btn").classList.add("hidden");
      document.getElementById("board").classList.add("hidden");
      document.getElementById("retry-msg").innerText = "";
      updateStatus("Searching for another player...");
    }

    function requestRetry() {
      ws.send(JSON.stringify({ type: "RETRY" }));
      document.getElementById("retry-btn").disabled = true;
      updateStatus("Waiting for opponent to accept rematch...");
    }

    function makeMove(position) {
      if (currentTurn !== mySymbol) return;
      ws.send(JSON.stringify({ type: "MOVE", position }));
    }

    function renderBoard(board) {
      const cells = document.querySelectorAll(".cell");
      board.forEach((val, i) => {
        cells[i].className = "cell";
        if (val === "X") {
          cells[i].innerHTML = svgIconX;
          cells[i].classList.add("pop-x");
        } else if (val === "O") {
          cells[i].innerHTML = svgIconO;
          cells[i].classList.add("pop-o");
        } else {
          cells[i].innerHTML = "";
        }
      });
    }

    function updateStatus(txt) {
      document.getElementById("status").innerText = txt;
    }

    function triggerFireworks() {
      const canvas = document.getElementById("confetti-canvas");
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = [];
      const colors = ['#38bdf8', '#06b6d4', '#ec4899', '#10b981', '#f59e0b', '#ffffff'];

      for (let i = 0; i < 120; i++) {
        particles.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          vx: (Math.random() - 0.5) * 14,
          vy: (Math.random() - 0.7) * 16,
          size: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1,
          decay: Math.random() * 0.015 + 0.008
        });
      }

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let active = false;

        particles.forEach(p => {
          if (p.alpha > 0) {
            active = true;
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.25;
            p.alpha -= p.decay;

            ctx.globalAlpha = Math.max(p.alpha, 0);
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, p.size, p.size);
          }
        });

        if (active) {
          requestAnimationFrame(render);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }

      render();
    }
  </script>
</body>
</html>
